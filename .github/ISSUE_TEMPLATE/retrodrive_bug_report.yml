name: Bug report / 不具合の報告
description: Report a problem with RetroDrive / RetroDriveの不具合を報告します
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include personal or sensitive information. / 個人情報や機密情報は記載しないでください。"
  - type: input
    id: device
    attributes:
      label: Device / 端末
      placeholder: iPhone model or iPad model
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: iOS version / iOSバージョン
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 期待する結果
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 実際の結果
    validations:
      required: true
