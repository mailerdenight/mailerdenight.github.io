<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mailerdenight</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef8ff;
      --panel: #ffffff;
      --text: #17324d;
      --muted: #57738f;
      --line: #cfe3f4;
      --accent: #1b8cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #d9f0ff 0%, transparent 35%),
        linear-gradient(180deg, #f6fbff 0%, var(--bg) 100%);
      line-height: 1.8;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 16px 40px rgba(27, 140, 255, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.2;
    }

    p, li, a {
      font-size: 16px;
    }

    .links {
      padding-left: 1.2em;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>アプリ サポート情報</h1>
      <p>公開中のアプリに関するサポート情報ページです。</p>
      <ul class="links">
        <li><a href="https://mailerdenight.github.io/norimono-sound-privacy/">のりものサウンド プライバシーポリシー</a></li>
        <li><a href="https://mailerdenight.github.io/norimono-sound-privacy/support/">のりものサウンド サポート</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
