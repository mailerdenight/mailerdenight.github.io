<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>親子の返済ノート</title>
  <meta name="description" content="親子で立て替え・返済を確認">
  <link rel="canonical" href="https://mailerdenight.github.io/parent-child-repayment/">
  <link rel="stylesheet" href="style.css">
</head>
<body><main>
  <header><strong>親子の返済ノート</strong><nav><a href="privacy/">プライバシー</a><a href="support/">サポート</a></nav></header>
  <h1>残りいくらか、<br>ふたりですぐに。</h1>
  <p class="lead">親子で立て替え・返済を確認するiPhoneアプリです。</p>
  <div class="card"><p>親が記録した金額と返済履歴を、子どもは自分のiPhoneから閲覧できます。返済予定はお知らせしますが、実際の返済は親が確認してから記録します。送金や決済は行いません。</p></div>
  <section class="gallery" aria-label="アプリの紹介画像">
    <h2>使い方が、ひと目で分かる</h2>
    <div class="gallery-grid">
      <figure><img src="images/01-parent-child-records.png" width="1284" height="2778" loading="lazy" alt="ガチャガチャ代とスマートフォン本体代の残額を、子どもごとに確認する紹介画像"><figcaption>残額をまとめて確認</figcaption></figure>
      <figure><img src="images/02-partial-repayment.png" width="1284" height="2778" loading="lazy" alt="15万円から1万円を返済すると残り14万円になる紹介画像"><figcaption>返済するたびに残額を更新</figcaption></figure>
      <figure><img src="images/03-parent-child-sharing.png" width="1284" height="2778" loading="lazy" alt="親と子どもの画面で同じ残額を確認する紹介画像"><figcaption>親子で同じ記録を見る</figcaption></figure>
      <figure><img src="images/04-parent-child-read-only-sharing.png" width="1284" height="2778" loading="lazy" alt="親が記録し、子どもは自分の残額と履歴だけを閲覧する紹介画像"><figcaption>親が記録、子どもは閲覧専用</figcaption></figure>
    </div>
  </section>
  <footer><a href="privacy/">プライバシーポリシー</a><a href="support/">サポート</a></footer>
</main></body></html>
