<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="動物の鳴き声と音当てクイズを楽しめる、どうぶつサウンドの公式案内ページです。">
  <title>どうぶつの鳴き声・動物サウンド</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf9ff;
      --panel: #ffffff;
      --text: #17324d;
      --muted: #55728d;
      --line: #cde8f5;
      --blue: #176fe5;
      --orange: #f38a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #fff1a8 0%, transparent 32%), linear-gradient(180deg, #dcf5ff 0%, var(--bg) 100%);
      line-height: 1.8;
    }
    main { max-width: 820px; margin: 0 auto; padding: 36px 20px 56px; }
    .hero, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 30px 26px;
      box-shadow: 0 16px 40px rgba(23, 111, 229, 0.09);
    }
    .hero { text-align: center; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 48px); line-height: 1.25; color: var(--blue); }
    .lead { color: var(--muted); font-size: 18px; }
    .card { margin-top: 18px; }
    h2 { margin-top: 0; color: var(--orange); }
    .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
    .links a {
      display: block;
      padding: 18px;
      border-radius: 18px;
      background: #f6fbff;
      border: 1px solid var(--line);
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }
    li { margin: 5px 0; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>どうぶつの鳴き声・動物サウンド</h1>
      <p class="lead">犬・猫・ライオンなど12種類の鳴き声を聞いて、見て、クイズで楽しめる音あそびアプリです。</p>
    </section>

    <section class="card">
      <h2>アプリの特長</h2>
      <ul>
        <li>絵をタップするだけの簡単操作</li>
        <li>12種類の動物の鳴き声</li>
        <li>音を聞いて答える音当てクイズ</li>
        <li>アカウント登録不要</li>
        <li>買い切り購入後はクイズ全機能を解放し、バナー広告を非表示</li>
      </ul>
    </section>

    <section class="card links" aria-label="関連ページ">
      <a href="../doubutsu-sound-privacy/support/">サポート</a>
      <a href="../doubutsu-sound-privacy/">プライバシーポリシー</a>
      <a href="https://apps.apple.com/app/id6799204438">App Storeで見る</a>
    </section>
  </main>
</body>
</html>
